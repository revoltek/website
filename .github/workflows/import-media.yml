# One-time job: copies the images and files of the old WordPress site into
# static/media/, commits them, then rebuilds the site.
# Run it from the Actions tab while the old site is still online.
name: Import media from old site

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # to start the deploy workflow afterwards

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/import_media.py
      - name: Commit the files
        run: |
          git add static/media
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Import media from the old WordPress site"
            git push
          fi
      - name: Rebuild the site
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
