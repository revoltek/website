# Builds the site and publishes it on GitHub Pages.
# Runs on every push to main, every Monday morning (to refresh the publication
# list from NASA ADS), and on demand from the Actions tab ("Run workflow").
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write    # to commit the refreshed data/publications.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ADS_TOKEN: ${{ secrets.ADS_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh publications from NASA ADS
        if: env.ADS_TOKEN != ''
        # A failed ADS call keeps last week's list instead of breaking the site.
        continue-on-error: true
        run: python scripts/update_publications.py

      - name: Save the refreshed list in the repository
        if: env.ADS_TOKEN != ''
        run: |
          if ! git diff --quiet -- data/publications.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/publications.json
            git commit -m "Update publications from NASA ADS"
            git push
          fi

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build
        run: python build.py
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
