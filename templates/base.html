<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ head_title }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ canonical }}">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:site_name" content="{{ site_name }}">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/spectral-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="/css/style.css?v={{ css_version }}">
{{ gtm_head }}
</head>
<body>
{{ gtm_body }}
<a class="skip" href="#main">Skip to content</a>
<header class="masthead">
  <p class="name"><a href="/">{{ title }}</a></p>
  <button class="theme-toggle" type="button" data-next="light" aria-label="Switch to a light background">
    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
    <span>Light</span>
  </button>
  {{ ruler }}
  <nav aria-label="Main">
    <ul>
{{ nav }}
    </ul>
  </nav>
</header>
<main id="main">
{{ content }}
</main>
<footer>
  <p>© {{ year }} Francesco de Gasperin. The publication list is refreshed every week from <a href="https://ui.adsabs.harvard.edu/">NASA ADS</a>, last on {{ pubs_updated }}.</p>
</footer>
<script>
(function () {
  var b = document.querySelector(".theme-toggle"), root = document.documentElement;
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  function current() { return root.dataset.theme || (mq.matches ? "dark" : "light"); }
  function update() {
    var next = current() === "dark" ? "light" : "dark";
    b.dataset.next = next;
    b.querySelector("span").textContent = next === "light" ? "Light" : "Dark";
    b.setAttribute("aria-label", "Switch to a " + next + " background");
  }
  b.addEventListener("click", function () {
    root.dataset.theme = b.dataset.next;
    try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
    update();
  });
  if (mq.addEventListener) mq.addEventListener("change", update);
  update();
})();
</script>
</body>
</html>
