<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ head_title }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ canonical }}">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:site_name" content="{{ site_name }}">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/spectral-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/style.css?v={{ css_version }}">
{{ gtm_head }}
</head>
<body>
{{ gtm_body }}
<a class="skip" href="#main">Skip to content</a>
<header class="masthead">
  <p class="name"><a href="/">{{ title }}</a></p>
  {{ ruler }}
  <nav aria-label="Main">
    <ul>
{{ nav }}
    </ul>
  </nav>
</header>
<main id="main">
{{ content }}
</main>
<footer>
  <p>© {{ year }} Francesco de Gasperin. The publication list is refreshed every week from <a href="https://ui.adsabs.harvard.edu/">NASA ADS</a>, last on {{ pubs_updated }}.</p>
</footer>
</body>
</html>
