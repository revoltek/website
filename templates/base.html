<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ head_title }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ canonical }}">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:site_name" content="{{ site_name }}">
<meta property="og:type" content="{{ og_type }}">
<meta property="og:image" content="{{ og_image }}">
<meta name="twitter:card" content="summary">
<meta name="keywords" content="{{ keywords }}">
<meta name="author" content="Francesco De Gasperin">
{{ jsonld }}
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/source-sans-3-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="/css/style.css?v={{ css_version }}">
{{ gtm_head }}
</head>
<body class="{{ body_class }}">
{{ gtm_body }}
<a class="skip" href="#main">Skip to content</a>
<div class="layout">
{{ sidebar }}
<main id="main">
{{ content }}
<footer><p>© {{ year }} Francesco De Gasperin</p></footer>
</main>
</div>
<script>
(function () {
  var root = document.documentElement;

  // Light / dark switch
  var b = document.querySelector(".theme-toggle");
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  function current() { return root.dataset.theme || (mq.matches ? "dark" : "light"); }
  function update() {
    var next = current() === "dark" ? "light" : "dark";
    b.dataset.next = next;
    b.querySelector("span").textContent = next === "light" ? "Light" : "Dark";
    b.setAttribute("aria-label", "Switch to a " + next + " background");
  }
  b.addEventListener("click", function () {
    root.dataset.theme = b.dataset.next;
    try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
    update();
  });
  if (mq.addEventListener) mq.addEventListener("change", update);
  update();

  // Publication filter: first author / co-author / all
  var list = document.querySelector(".publist");
  var buttons = document.querySelectorAll(".pubfilter button");
  buttons.forEach(function (btn) {
    btn.addEventListener("click", function () {
      list.dataset.filter = btn.dataset.filter;
      buttons.forEach(function (o) { o.setAttribute("aria-pressed", o === btn ? "true" : "false"); });
    });
  });
  if (list) list.dataset.filter = "first";
})();
</script>
</body>
</html>
