# Site settings. Edit this file to change the sidebar, the sections or the ADS query.

title: Francesco de Gasperin
site_name: degasperin.com
description: Personal page of Francesco de Gasperin, radio astronomer at IRA-INAF, Bologna.
url: https://degasperin.com        # canonical address, no trailing slash
lang: en

# Google Tag Manager container used by the old site. Leave empty ("") to load no tracking at all.
gtm_id: GTM-PPL92K6

# Left column
profile:
  name: Francesco de Gasperin
  photo: /media/FrancescoDeGasperin_photo4.jpg
  role:
    - Staff Scientist, Istituto di Radioastronomia, INAF
    - Visiting Jr. Professor, University of Hamburg
    - PI of the ERC Consolidator project ULU
  logo: /media/inaf.png
  logo_url: https://www.inaf.it
  logo_alt: INAF – Istituto Nazionale di Astrofisica
  links:
    - {title: NASA ADS, icon: ads, url: "https://ui.adsabs.harvard.edu/search/q=author%3A%22de%20Gasperin%2C%20F%22%20property%3Arefereed&sort=date%20desc%2C%20bibcode%20desc"}
    - {title: GitHub,   icon: github, url: "https://github.com/revoltek"}

# Sections of the home page, in order; they also form the menu. "file" is in content/.
sections:
  - {id: about,        title: About,        file: index.md}
  - {id: research,     title: Research,     file: research.md}
  - {id: publications, title: Publications, file: publications.md}
  - {id: talks,        title: Talks,        file: talks.md}
  - {id: cv,           title: CV,           file: cv.md}
  - {id: contact,      title: Contact,      file: contacts.md}

# Separate pages listed after the sections
pages:
  - {key: blog, title: Blog, url: /blog/}

# Old addresses that now point into the home page
redirects:
  /research/: /#research
  /research/publications/: /#publications
  /research/talks/: /#talks
  /research/group/: /#research
  /data/: /#research
  /cv/: /#cv
  /contacts/: /#contact

# Publication list, refreshed every week from NASA ADS by .github/workflows/deploy.yml
ads:
  author: "de Gasperin, F"      # ADS author name; first-author papers use "^de Gasperin, F"
  orcid: ""                     # optional, e.g. 0000-0000-0000-0000: restricts to papers with your ORCID claimed
  collection: all               # "all" or "astronomy"
  exclude_doctypes: [phdthesis] # ADS doctypes to leave out of the list
  search_url: "https://ui.adsabs.harvard.edu/search/q=author%3A%22de%20Gasperin%2C%20F%22%20property%3Arefereed&sort=date%20desc%2C%20bibcode%20desc"
  max_authors_shown: 10         # longer author lists are cut with "et al."
